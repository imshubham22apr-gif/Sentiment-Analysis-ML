  display:
    keywords: ["screen", "display", "amoled", "brightness", "panel", "touch", "refresh rate", "hz"]
  delivery:
    keywords: ["delivery", "rider", "courier", "package", "time", "late", "delay", "pahuncha", "shipping"]
  food:
    keywords: ["food", "khana", "taste", "swaad", "portion", "quantity", "dish", "meal", "biryani", "roti", "chai"]
  service:
    keywords: ["service", "staff", "behavior", "support", "helpdesk", "customer care", "waiter", "attitude"]
  price:
    keywords: ["price", "paisa", "daam", "rate", "cost", "cheap", "expensive", "sasta", "mehnga", "worth", "value"]

