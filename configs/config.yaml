model:
  name: "l3cube-pune/hing-roberta"
  fallback_name: "shae2977/xlm-roberta-hinglish-sentiment-analysis"
  max_sequence_length: 128
  batch_size: 16
  device: "cpu"
  onnx_export_path: "models/hinglish_sentiment.onnx"
  quantized_onnx_path: "models/hinglish_sentiment_int8.onnx"

thresholds:
  confidence_threshold: 0.60
  cmi_high_threshold: 30.0

aspects:
